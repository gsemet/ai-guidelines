name: Publish

# Production publication is deliberately dispatched from the release tag.
on:
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ai-guidelines
    permissions:
      contents: read
      # Required for PyPI Trusted Publishing (OIDC). No API token is used.
      id-token: write
    steps:
      - name: Validate trigger and tag
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_REF" != refs/tags/v[0-9]*.[0-9]*.[0-9]* ]]; then
            echo "::error::Production PyPI publication must be dispatched from a semantic-version tag."
            exit 1
          fi
          target_tag="${WORKFLOW_REF#refs/tags/}"
          if [[ ! "$target_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$target_tag' has an unexpected shape."
            exit 1
          fi
          echo "RELEASE_TAG=$target_tag" >> "$GITHUB_ENV"

      - name: Check out the tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify tag ancestry
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin \
            "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          target_commit="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          if ! git merge-base --is-ancestor "$target_commit" "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo "::error::Release tag $RELEASE_TAG is not reachable from the default branch."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Build distributions
        run: uv build

      - name: Verify package version
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${RELEASE_TAG#v}"
          shopt -s nullglob
          artifacts=(
            dist/ai_guidelines-"$expected_version"-*.whl
            dist/ai_guidelines-"$expected_version".tar.gz
          )
          if (( ${#artifacts[@]} != 2 )); then
            echo "::error::Built package artifacts do not match $RELEASE_TAG."
            printf '%s\n' dist/*
            exit 1
          fi

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
