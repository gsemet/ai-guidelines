# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    post_checkout:
      # Mandatory for hatch-vcs: without tags the version cannot be derived.
      - git fetch --unshallow || true
      - git fetch --tags
    pre_build:
      - uv run cz changelog

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

python:
  install:
    - method: uv
      command: sync
      groups:
        - dev
        - docs
